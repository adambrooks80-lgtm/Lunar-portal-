<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
">

<div id="moon" style="position:relative; width:240px; height:240px;">

  <!-- full moon -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    background:#dddddd;
    border-radius:50%;
  "></div>

  <!-- shadow -->
  <div id="shadow" style="
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    border-radius:50%;
    transform:translateX(80px);
  "></div>

</div>

<script>
// 🌗 real lunar cycle ≈ 29.53 days
const cycle = 29.53 * 24 * 60 * 60 * 1000;

// reference new moon (fixed point)
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const shadow = document.getElementById("shadow");

function updateMoon(){
  const now = Date.now();
  const phase = ((now - newMoon) % cycle) / cycle;

  // convert phase → position
  const offset = Math.cos(phase * Math.PI * 2);

  // scale to pixels
  const px = offset * 120;

  shadow.style.transform = `translateX(${px}px)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();
</script>

</body>
</html>
