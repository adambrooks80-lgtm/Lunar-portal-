<!DOCTYPE html>
<html>
<body style="margin:0;background:#121212;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// 🌗 Test phase (0–1)
const phase = 0.25;

// 🌙 Create stable texture once
let craters = [];

function createTexture(){
  const r = Math.min(canvas.width, canvas.height)*0.18;

  craters = [];
  for(let i=0;i<60;i++){
    craters.push({
      x: (Math.random() - 0.5) * r * 1.6,
      y: (Math.random() - 0.5) * r * 1.6,
      size: Math.random() * r * 0.05
    });
  }
}

createTexture();

function draw(){
  const w = canvas.width;
  const h = canvas.height;

  const cx = w/2;
  const cy = h/2;
  const r = Math.min(w,h)*0.18;

  ctx.fillStyle = "#121212";
  ctx.fillRect(0,0,w,h);

  // 🌙 Draw FULL moon first
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = "#bbb";
  ctx.fill();

  // 🌙 Apply shadow as a soft overlay (NOT cut-out)
  const angle = phase * Math.PI * 2;
  const shift = Math.cos(angle) * r;

  ctx.globalCompositeOperation = "multiply";

  ctx.beginPath();
  ctx.arc(cx + shift, cy, r, 0, Math.PI*2);
  ctx.fillStyle = "rgba(0,0,0,0.9)";
  ctx.fill();

  ctx.globalCompositeOperation = "source-over";

  // 🌙 Texture (stable)
  ctx.globalAlpha = 0.06;
  for(let c of craters){
    ctx.beginPath();
    ctx.arc(cx + c.x, cy + c.y, c.size, 0, Math.PI*2);
    ctx.fillStyle = "black";
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
