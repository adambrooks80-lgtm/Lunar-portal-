<!DOCTYPE html>
<html>
<body style="margin:0;background:#121212;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

function getPhase(){
  const t = Date.now() / 1000;
  return (t % 20) / 20;
}

function draw(){
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = "#121212";
  ctx.fillRect(0,0,w,h);

  const cx = w/2;
  const cy = h/2;
  const r = Math.min(w,h)*0.2;

  // 🌙 HALO (draw FIRST - important)
  const halo = ctx.createRadialGradient(cx, cy, r*0.8, cx, cy, r*2.2);
  halo.addColorStop(0, "rgba(200,200,200,0.08)");
  halo.addColorStop(1, "rgba(0,0,0,0)");

  ctx.beginPath();
  ctx.arc(cx, cy, r*2.2, 0, Math.PI*2);
  ctx.fillStyle = halo;
  ctx.fill();

  // 🌙 BASE MOON
  const base = ctx.createRadialGradient(
    cx - r*0.35, cy - r*0.35, r*0.2,
    cx, cy, r
  );
  base.addColorStop(0, "#eee");
  base.addColorStop(0.5, "#bbb");
  base.addColorStop(1, "#666");

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = base;
  ctx.fill();

  // 🌗 PHASE (ellipse shadow)
  const phase = getPhase();

  ctx.fillStyle = "#121212";
  ctx.beginPath();

  ctx.ellipse(
    cx + (phase - 0.5) * 2 * r,
    cy,
    r,
    r * (0.6 + 0.4 * Math.abs(phase - 0.5)),
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  // clip to circle
  ctx.globalCompositeOperation = "destination-in";
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";
}

function loop(){
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
