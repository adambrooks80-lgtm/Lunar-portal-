<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:linear-gradient(45deg, #ff6600, #00ffff);
  height:100vh;
  overflow:hidden;
">

<!-- 🌌 SKY (optional stars) -->
<div id="sky">
</div>

<!-- 🌙 MOON -->
<div id="moon" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:260px;
  height:260px;
  border-radius:50%;
  overflow:hidden;
">

  <!-- 🌙 CROPPED MOON IMAGE -->
  <div style="
    width:112%;
    height:112%;
    margin:-6%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    background-position:center;
  "></div>

</div>

</body>
</html>
