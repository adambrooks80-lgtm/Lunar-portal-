<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<!-- ⭐ STARS -->
<div id="stars"></div>

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <!-- 🌫️ HALO (fixed centre + subtle bias) -->
  <div id="halo" style="
    position:absolute;
    width:160%;
    height:160%;
    top:-30%;
    left:-30%;
    border-radius:50%;
    pointer-events:none;
    background: radial-gradient(
      circle at center,
      rgba(255,255,255,0.12),
      rgba(255,255,255,0.05) 35%,
      rgba(255,255,255,0.02) 55%,
      transparent 75%
    );
    filter: blur(25px);
    opacity:0.9;
  "></div>

  <!-- 🌙 BRIGHT MOON -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
  "></div>

  <!-- 🌑 EARTHSHINE -->
  <div id="earthshine" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    opacity:0.10;
  "></div>

  <!-- 🌗 SOFT TERMINATOR -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">
    <div id="mask" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(
        circle,
        rgba(0,0,0,0.92) 55%,
        rgba(0,0,0,0.6) 65%,
        rgba(0,0,0,0.3) 75%,
        rgba(0,0,0,0.1) 85%,
        transparent 100%
      );
      filter: blur(3px);
    "></div>
  </div>

</div>

<style>
#stars{
  position:absolute;
  width:100%;
  height:100%;
}
.star{
  position:absolute;
  background:white;
  border-radius:50%;
}
</style>

<script>

// 🌙 PHASE SYSTEM
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 12000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const mask = document.getElementById("mask");
const halo = document.getElementById("halo");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const offset = Math.cos(angle) * 260;

  // 🌗 phase movement
  mask.style.transform = `translateX(${offset}px)`;

  // 🌫️ VERY subtle halo shift (less than before)
  halo.style.transform = `translateX(${offset * 0.05}px)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();


// ⭐ STARS (visible but subtle)
const starContainer = document.getElementById("stars");
let stars = [];

function createStars(){
  for(let i=0;i<90;i++){
    const s = document.createElement("div");

    const size = Math.random()*1.8 + 0.4;

    s.className = "star";
    s.style.width = size+"px";
    s.style.height = size+"px";

    s.x = Math.random()*window.innerWidth;
    s.y = Math.random()*window.innerHeight;

    s.style.left = s.x+"px";
    s.style.top = s.y+"px";

    s.style.opacity = Math.random()*0.6 + 0.2;

    stars.push(s);
    starContainer.appendChild(s);
  }
}

createStars();

// ✨ subtle twinkle (magic)
function twinkle(){
  for(let s of stars){
    s.style.opacity += (Math.random()-0.5)*0.02;
    s.style.opacity = Math.max(0.1, Math.min(0.7, s.style.opacity));
  }
  requestAnimationFrame(twinkle);
}

twinkle();

</script>

</body>
</html>
