<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  flex-direction:column;
  color:white;
  font-family:sans-serif;
">

<div id="moon" style="position:relative; width:240px; height:240px;">

  <!-- full moon -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    background:#dddddd;
    border-radius:50%;
  "></div>

  <!-- shadow -->
  <div id="shadow" style="
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    border-radius:50%;
    transform:translateX(80px);
  "></div>

</div>

<button id="toggle" style="margin-top:20px;padding:10px 20px;">
  Toggle Demo Speed
</button>

<script>
let demo = true;

const shadow = document.getElementById("shadow");
const btn = document.getElementById("toggle");

btn.onclick = () => {
  demo = !demo;
  btn.innerText = demo ? "Switch to Real Time" : "Switch to Demo";
};

// real lunar cycle
const realCycle = 29.53 * 24 * 60 * 60 * 1000;

// demo cycle (10 seconds)
const demoCycle = 10000;

const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

function updateMoon(){
  const now = Date.now();

  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;

  const offset = Math.cos(phase * Math.PI * 2);

  const px = offset * 120;

  shadow.style.transform = `translateX(${px}px)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();
</script>

</body>
</html>
