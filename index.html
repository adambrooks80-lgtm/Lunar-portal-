<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
  font-family:sans-serif;
">

<!-- ⭐ STARS -->
<div id="stars"></div>

<!-- 🌙 MOON -->
<div id="moonWrap" style="
  position:relative;
  width:260px;
  height:260px;
">

  <!-- glow -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow: 0 0 80px 20px rgba(200,200,200,0.15);
  "></div>

  <!-- moon surface -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    background: radial-gradient(circle at 30% 30%, #eeeeee, #bbbbbb 60%, #777777);
    border-radius:50%;
  "></div>

  <!-- shadow -->
  <div id="shadow" style="
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    border-radius:50%;
    transform:translateX(80px);
  "></div>

</div>

<script>
// --------------------
// 🌙 MOON PHASE
// --------------------
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 10000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const shadow = document.getElementById("shadow");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;
  const offset = Math.cos(phase * Math.PI * 2);

  shadow.style.transform = `translateX(${offset * 130}px)`;

  requestAnimationFrame(updateMoon);
}
updateMoon();

// --------------------
// ⭐ STARS
// --------------------
const starContainer = document.getElementById("stars");

function createStars(){
  for(let i = 0; i < 120; i++){
    const star = document.createElement("div");

    const size = Math.random() * 2 + 1;

    star.style.position = "absolute";
    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.background = "white";
    star.style.borderRadius = "50%";

    star.style.left = Math.random() * window.innerWidth + "px";
    star.style.top = Math.random() * window.innerHeight + "px";

    star.style.opacity = Math.random() * 0.5 + 0.3;

    // subtle twinkle
    star.animate(
      [
        { opacity: star.style.opacity },
        { opacity: Math.random() * 0.2 }
      ],
      {
        duration: 2000 + Math.random() * 3000,
        iterations: Infinity,
        direction: "alternate",
        easing: "ease-in-out"
      }
    );

    starContainer.appendChild(star);
  }
}

createStars();
</script>

</body>
</html>
