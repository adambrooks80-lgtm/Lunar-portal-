<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<!-- SKY -->
<div id="skyWrap">
  <div id="stars"></div>
</div>

<!-- subtle ambient -->
<div id="ambient"></div>

<!-- MOON -->
<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <!-- 🌙 MOON SURFACE -->
  <div id="moonSurface" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
  "></div>

  <!-- 🌙 LIGHT BOOST -->
  <div id="lightLayer" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:white;
    opacity:0;
    mix-blend-mode:screen;
  "></div>

  <!-- 🌑 EARTHSHINE -->
  <div id="earthshine" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:white;
    opacity:0;
    mix-blend-mode:screen;
  "></div>

  <!-- 🌗 SHADOW -->
  <div id="shadow" style="
    position:absolute;
    width:120%;
    height:120%;
    top:-10%;
    left:-10%;
    border-radius:50%;
    background:black;
  "></div>

</div>

<style>
#skyWrap{
  position:absolute;
  width:100%;
  height:100%;
}

#stars{
  position:absolute;
  width:100%;
  height:100%;
}

.star{
  position:absolute;
  background:white;
  border-radius:50%;
}

#ambient{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}
</style>

<script>

// 🌙 CLOCK
const cycle = 12000;
const start = Date.now();

const shadow = document.getElementById("shadow");
const lightLayer = document.getElementById("lightLayer");
const earthshine = document.getElementById("earthshine");
const moonWrap = document.getElementById("moonWrap");
const skyWrap = document.getElementById("skyWrap");
const ambient = document.getElementById("ambient");

// ⭐ STARS
const stars = [];
const starContainer = document.getElementById("stars");

for(let i=0;i<90;i++){
  const s = document.createElement("div");
  s.className = "star";

  const size = Math.random()*1.4 + 0.4;
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  stars.push(s);
  starContainer.appendChild(s);
}

// 🌙 UPDATE
function update(){

  const phase = ((Date.now() - start) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const offset = Math.cos(angle) * 220;

  // 🌗 SHADOW
  shadow.style.transform = `translateX(${offset}px)`;

  // 🌙 UK-style tilt (subtle oscillation)
  const tilt = 12 + Math.sin(angle * 0.5) * 6;
  moonWrap.style.transform =
    `translate(-50%,-50%) rotate(${tilt}deg)`;

  // 🌌 VERY slow sky rotation
  skyWrap.style.transform =
    `rotate(${phase * 360}deg)`;

  // ⭐ twinkle (very subtle)
  for(let s of stars){
    s.style.opacity += (Math.random()-0.5)*0.008;
    s.style.opacity = Math.max(0.1, Math.min(0.7, s.style.opacity));
  }

  // 🌙 illumination
  const illum = (1 - Math.cos(angle)) / 2;

  // 🌙 light side boost
  lightLayer.style.opacity = illum * 0.08;
  lightLayer.style.transform =
    `translateX(${offset * 0.2}px)`;

  // 🌑 earthshine
  earthshine.style.opacity = (1 - illum) * 0.08;

  // ✨ MAGIC (very subtle)
  const fullBoost = Math.pow(illum, 6);      // near full moon
  const newBoost  = Math.pow(1 - illum, 6);  // near new moon

  ambient.style.background = `
    radial-gradient(circle at center,
      rgba(255,255,255,${fullBoost * 0.05}),
      rgba(100,120,255,${newBoost * 0.05}),
      transparent 70%
    )
  `;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
