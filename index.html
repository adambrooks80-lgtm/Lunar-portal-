<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<div id="skyWrap">
  <div id="stars"></div>
  <div id="ambientGlow"></div>
</div>

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">

    <!-- 🌙 SURFACE -->
    <div id="moonSurface" style="
      position:absolute;
      width:100%;
      height:100%;
      background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
      background-size:cover;
      z-index:1;
    "></div>

    <!-- 🌙 DEPTH -->
    <div id="moonDepth" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      pointer-events:none;
      z-index:2;
    "></div>

    <!-- 🌑 SHADOW -->
    <div id="shadowMain" style="
      position:absolute;
      width:120%;
      height:120%;
      top:-10%;
      left:-10%;
      border-radius:50%;
      background:black;
      z-index:3;

      -webkit-mask-image: radial-gradient(circle,
        rgba(0,0,0,1) 50%,
        rgba(0,0,0,0.9) 52%,
        rgba(0,0,0,0.6) 54%,
        rgba(0,0,0,0.25) 56%,
        rgba(0,0,0,0.08) 58%,
        rgba(0,0,0,0) 60%
      );

      mask-image: radial-gradient(circle,
        rgba(0,0,0,1) 50%,
        rgba(0,0,0,0.9) 52%,
        rgba(0,0,0,0.6) 54%,
        rgba(0,0,0,0.25) 56%,
        rgba(0,0,0,0.08) 58%,
        rgba(0,0,0,0) 60%
      );
    "></div>

  </div>

</div>

<style>
#skyWrap{
  position:absolute;
  width:100%;
  height:100%;
}

#stars{
  position:absolute;
  width:100%;
  height:100%;
}

#ambientGlow{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}

.star{
  position:absolute;
  background:white;
  border-radius:50%;
}
</style>

<script>

const cycle = 12000;
const start = Date.now();

const shadowMain = document.getElementById("shadowMain");
const moonDepth = document.getElementById("moonDepth");
const moonSurface = document.getElementById("moonSurface");
const ambientGlow = document.getElementById("ambientGlow");
const moonWrap = document.getElementById("moonWrap");
const skyWrap = document.getElementById("skyWrap");

// stars
const starContainer = document.getElementById("stars");

for(let i=0;i<100;i++){
  const s = document.createElement("div");
  s.className = "star";

  const size = Math.random()*1.4 + 0.4;
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  starContainer.appendChild(s);
}

function update(){

  const now = Date.now();
  const elapsed = now - start;

  const phase = (elapsed % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const illum = (1 - Math.cos(angle)) / 2;

  const moonRadius = 130;
  const shadowRadius = 150;
  const travel = moonRadius + shadowRadius;

  const offset = Math.cos(angle) * travel;

  shadowMain.style.transform = `translateX(${offset}px)`;

  // 🌙 DEPTH
  moonDepth.style.background = `
    radial-gradient(circle at 50% 50%,
      rgba(255,255,255,${0.06 * illum}) 0%,
      rgba(255,255,255,${0.03 * illum}) 40%,
      rgba(0,0,0,0.1) 100%
    )
  `;

  // 🌙 SURFACE
  moonSurface.style.filter =
    `brightness(${0.92 + illum * 0.12}) contrast(1.05)`;

  // 🌌 BOOSTED AMBIENT (THIS IS THE CHANGE)
  ambientGlow.style.background = `
    radial-gradient(circle at 50% 50%,
      rgba(255,255,255,${0.06 * illum}) 0%,
      rgba(255,255,255,${0.03 * illum}) 30%,
      rgba(255,255,255,0) 75%
    )
  `;

  // motion
  const rotation = Math.sin(elapsed * 0.00005) * 4;
  const tilt = 12 + Math.sin(angle * 0.5) * 5;

  moonWrap.style.transform =
    `translate(-50%,-50%) rotate(${tilt}deg)`;

  moonSurface.style.transform =
    `rotate(${rotation}deg)`;

  skyWrap.style.transform =
    `rotate(${phase * 360}deg)`;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
