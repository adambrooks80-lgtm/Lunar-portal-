<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  overflow:hidden;
  height:100vh;
">

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <!-- 🌫️ HALO -->
  <div style="
    position:absolute;
    width:150%;
    height:150%;
    top:-25%;
    left:-25%;
    border-radius:50%;
    background: radial-gradient(
      circle at 60% 50%,
      rgba(255,255,255,0.12),
      rgba(255,255,255,0.04) 40%,
      transparent 75%
    );
    filter: blur(25px);
  "></div>

  <!-- 🌙 FULL MOON -->
  <div id="moon" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    overflow:hidden;
  ">

    <!-- 🌑 DARK SIDE -->
    <div id="darkMask" style="
      position:absolute;
      width:100%;
      height:100%;
      background:black;
      opacity:0.85;
    "></div>

    <!-- 🌗 LIGHT CUT (this creates real phase) -->
    <div id="lightMask" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background:black;
      transform:translateX(0px);
    "></div>

  </div>

</div>

<script>

// 🌙 PHASE SYSTEM (TRUE MODEL)
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 12000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const lightMask = document.getElementById("lightMask");
const darkMask = document.getElementById("darkMask");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  // illumination (0 → 1 → 0)
  const illum = (1 - Math.cos(angle)) / 2;

  // FULL RANGE movement
  const offset = Math.cos(angle) * 260;

  // move light cut fully across
  lightMask.style.transform = `translateX(${offset}px)`;

  // control overall darkness
  darkMask.style.opacity = 0.85;

  requestAnimationFrame(updateMoon);
}

updateMoon();

</script>

</body>
</html>
