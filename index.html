<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<div id="skyWrap">
  <div id="stars"></div>
</div>

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:260px;
  height:260px;
">

  <!-- 🌌 REALISTIC ATMOSPHERE (IMAGE BASED) -->
  <div id="moonAtmosphere" style="
    position:absolute;
    width:350%;
    height:350%;
    top:-125%;
    left:-125%;
    background:url('https://www.transparenttextures.com/patterns/foggy-birds.png');
    background-size:600px;
    opacity:0.15;
    filter:blur(40px);
    pointer-events:none;
    z-index:0;
  "></div>

  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">

    <div id="moonSurface" style="
      position:absolute;
      width:100%;
      height:100%;
      background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
      background-size:cover;
      z-index:1;
    "></div>

    <div id="shadowMain" style="
      position:absolute;
      width:120%;
      height:120%;
      top:-10%;
      left:-10%;
      border-radius:50%;
      background:black;
      z-index:2;

      -webkit-mask-image: radial-gradient(circle,
        rgba(0,0,0,1) 50%,
        rgba(0,0,0,0.8) 55%,
        rgba(0,0,0,0.3) 60%,
        rgba(0,0,0,0) 65%
      );

      mask-image: radial-gradient(circle,
        rgba(0,0,0,1) 50%,
        rgba(0,0,0,0.8) 55%,
        rgba(0,0,0,0.3) 60%,
        rgba(0,0,0,0) 65%
      );
    "></div>

  </div>

</div>

<style>
#skyWrap{ position:absolute; width:100%; height:100%; }
#stars{ position:absolute; width:100%; height:100%; }

.star{
  position:absolute;
  background:white;
  border-radius:50%;
}
</style>

<script>

const cycle = 12000;
const start = Date.now();

const shadowMain = document.getElementById("shadowMain");
const moonSurface = document.getElementById("moonSurface");

const starContainer = document.getElementById("stars");

for(let i=0;i<100;i++){
  const s = document.createElement("div");
  s.className = "star";

  const size = Math.random()*1.4 + 0.4;
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  starContainer.appendChild(s);
}

function update(){

  const now = Date.now();
  const elapsed = now - start;

  const phase = (elapsed % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const illum = (1 - Math.cos(angle)) / 2;

  const moonRadius = 130;
  const shadowRadius = 150;
  const travel = moonRadius + shadowRadius;

  const offset = Math.cos(angle) * travel;

  shadowMain.style.transform = `translateX(${offset}px)`;

  moonSurface.style.filter =
    `brightness(${0.95 + illum * 0.2}) contrast(1.05)`;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
