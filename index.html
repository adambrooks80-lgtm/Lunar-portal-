<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<div id="skyWrap">
  <div id="stars"></div>
</div>

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">

    <!-- 🌙 MOON TEXTURE -->
    <div id="moonSurface" style="
      position:absolute;
      width:100%;
      height:100%;
      background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
      background-size:cover;
    "></div>

    <!-- 🌙 LIGHT GRADIENT (THIS IS THE KEY CHANGE) -->
    <div id="lightFalloff" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      pointer-events:none;
    "></div>

    <!-- 🌗 TRANSITION -->
    <div id="terminatorBand" style="
      position:absolute;
      width:120%;
      height:120%;
      top:-10%;
      left:-10%;
      border-radius:50%;
      background:black;
      opacity:0.18;
    "></div>

    <!-- 🌗 SHADOW -->
    <div id="shadowMain" style="
      position:absolute;
      width:120%;
      height:120%;
      top:-10%;
      left:-10%;
      border-radius:50%;
      background:black;
      opacity:0.75;
    "></div>

  </div>

</div>

<style>
#skyWrap{ position:absolute; width:100%; height:100%; }
#stars{ position:absolute; width:100%; height:100%; }

.star{
  position:absolute;
  background:white;
  border-radius:50%;
}
</style>

<script>

const cycle = 12000;
const start = Date.now();

const shadowMain = document.getElementById("shadowMain");
const terminatorBand = document.getElementById("terminatorBand");
const lightFalloff = document.getElementById("lightFalloff");
const moonSurface = document.getElementById("moonSurface");
const moonWrap = document.getElementById("moonWrap");
const skyWrap = document.getElementById("skyWrap");

// stars
const starContainer = document.getElementById("stars");
for(let i=0;i<100;i++){
  const s = document.createElement("div");
  s.className = "star";

  const size = Math.random()*1.4 + 0.4;
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  starContainer.appendChild(s);
}

function update(){

  const now = Date.now();
  const elapsed = now - start;

  const phase = (elapsed % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const moonRadius = 130;
  const shadowRadius = 156;
  const travel = moonRadius + shadowRadius;

  const offset = Math.cos(angle) * travel;

  // 🌗 shadow
  shadowMain.style.transform = `translateX(${offset}px)`;
  terminatorBand.style.transform = `translateX(${offset + 5}px)`;

  // 🌙 subtle libration
  const rotation = Math.sin(elapsed * 0.00005) * 4;
  const tilt = 12 + Math.sin(angle * 0.5) * 5;

  moonWrap.style.transform =
    `translate(-50%,-50%) rotate(${tilt}deg)`;

  moonSurface.style.transform =
    `rotate(${rotation}deg)`;

  // 🌌 sky
  skyWrap.style.transform =
    `rotate(${phase * 360}deg)`;

  const illum = (1 - Math.cos(angle)) / 2;

  // 🌙 TRUE LIGHT FALLOFF (key improvement)
  lightFalloff.style.background = `
    linear-gradient(
      to right,
      rgba(0,0,0,0.35),
      rgba(0,0,0,0.15),
      rgba(255,255,255,${illum * 0.15}),
      rgba(255,255,255,${illum * 0.25})
    )
  `;

  // 🌙 subtle surface realism
  moonSurface.style.filter =
    `contrast(${1 + illum * 0.2})
     brightness(${0.9 + illum * 0.2})`;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
