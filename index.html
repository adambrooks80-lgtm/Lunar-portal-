<!DOCTYPE html>
<html>
<body style="margin:0;background:black;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// phase (0 = new, 0.5 = half, 1 = full cycle)
const phase = 0.25;

function draw(){
  const w = canvas.width;
  const h = canvas.height;

  const cx = w / 2;
  const cy = h / 2;
  const r = 140;

  ctx.fillStyle = "black";
  ctx.fillRect(0,0,w,h);

  // 🌗 convert phase to offset (-1 to 1)
  const t = Math.cos(phase * Math.PI * 2);

  // control shape width
  const offset = t * r * 0.8;

  ctx.beginPath();

  // left side
  ctx.arc(cx, cy, r, Math.PI/2, Math.PI*1.5);

  // right side (different offset = better shape)
  ctx.arc(cx + offset, cy, r, Math.PI*1.5, Math.PI/2, true);

  ctx.fillStyle = "#dddddd";
  ctx.fill();
}

draw();
</script>
</body>
</html>
