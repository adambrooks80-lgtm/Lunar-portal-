<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
">

<div id="moonWrap" style="
  position:relative;
  width:260px;
  height:260px;
">

  <!-- 🌙 HALO -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background: radial-gradient(
      circle,
      rgba(255,255,255,0.2) 0%,
      rgba(255,255,255,0.1) 55%,
      rgba(255,255,255,0.05) 70%,
      transparent 100%
    );
    transform: scale(1.25);
  "></div>

  <!-- 🌙 MOON -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size: cover;
  "></div>

  <!-- 🌗 TRUE SHADOW -->
  <div id="shadow" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background: rgba(0,0,0,0.85);
    filter: blur(4px);
    transform: translateX(80px);
  "></div>

  <!-- 🌙 faint texture in dark side -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size: cover;
    opacity:0.15;
    mix-blend-mode: lighten;
  "></div>

</div>

<script>
// 🌙 phase system
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 10000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const shadow = document.getElementById("shadow");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;

  // FULL RANGE FIX (this was your bug)
  const offset = Math.cos(phase * Math.PI * 2);

  shadow.style.transform = `translateX(${offset * 130}px)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();
</script>

</body>
</html>
