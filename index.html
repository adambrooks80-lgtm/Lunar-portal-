<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  flex-direction:column;
  color:white;
  font-family:sans-serif;
">

<div id="moonWrap" style="
  position:relative;
  width:260px;
  height:260px;
">

  <!-- 🌙 glow -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow: 0 0 80px 20px rgba(200,200,200,0.15);
  "></div>

  <!-- 🌙 full moon -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    background: radial-gradient(circle at 30% 30%, #eeeeee, #bbbbbb 60%, #777777);
    border-radius:50%;
  "></div>

  <!-- 🌗 shadow -->
  <div id="shadow" style="
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    border-radius:50%;
    transform:translateX(80px);
  "></div>

</div>

<button id="toggle" style="margin-top:20px;padding:10px 20px;">
  Toggle Demo Speed
</button>

<script>
let demo = true;

const shadow = document.getElementById("shadow");
const btn = document.getElementById("toggle");

btn.onclick = () => {
  demo = !demo;
  btn.innerText = demo ? "Switch to Real Time" : "Switch to Demo";
};

// real vs demo
const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 10000;

const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;

  const offset = Math.cos(phase * Math.PI * 2);
  const px = offset * 130;

  shadow.style.transform = `translateX(${px}px)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();
</script>

</body>
</html>
