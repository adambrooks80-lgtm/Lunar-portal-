<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  overflow:hidden;
  height:100vh;
">

<!-- ⭐ STARS -->
<div id="stars"></div>

<!-- 🌙 MOON -->
<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <!-- 🌫️ HALO -->
  <div id="halo" style="
    position:absolute;
    width:140%;
    height:140%;
    top:-20%;
    left:-20%;
    border-radius:50%;
    pointer-events:none;
    background: radial-gradient(
      circle at 65% 50%,
      rgba(255,255,255,0.15) 0%,
      rgba(255,255,255,0.06) 30%,
      rgba(255,255,255,0.02) 55%,
      transparent 80%
    );
    filter: blur(18px);
  "></div>

  <!-- 🌙 SURFACE -->
  <div id="moonSurface" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
  "></div>

  <!-- 🌗 SHADOW -->
  <div id="shadow" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:rgba(0,0,0,0.85);
    filter:blur(4px);
  "></div>

  <!-- 🌙 faint dark-side detail -->
  <div id="darkDetail" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    opacity:0.12;
    mix-blend-mode:lighten;
  "></div>

</div>

<style>
#stars{
  position:absolute;
  width:100%;
  height:100%;
}
.star{
  position:absolute;
  background:white;
  border-radius:50%;
}
</style>

<script>

// 🌙 PHASE SYSTEM (accurate but corrected brightness)
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 12000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const shadow = document.getElementById("shadow");
const halo = document.getElementById("halo");
const darkDetail = document.getElementById("darkDetail");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;

  const angle = phase * Math.PI * 2;

  const illumination = (1 - Math.cos(angle)) / 2;

  const direction = Math.sin(angle) >= 0 ? 1 : -1;

  // correct geometry
  const offset = direction * (1 - illumination) * 140;
  shadow.style.transform = `translateX(${offset}px)`;

  // FIX: do NOT dim lit side
  shadow.style.opacity = 1 - illumination;

  // subtle dark side detail only
  darkDetail.style.opacity = (1 - illumination) * 0.12;

  // halo follows light
  halo.style.transform = `translateX(${direction * 15}px)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();


// ⭐ STARS
const starContainer = document.getElementById("stars");
let stars = [];

function createStars(){
  for(let i=0;i<70;i++){
    const s = document.createElement("div");

    const size = Math.random()*1.6 + 0.3;

    s.className = "star";
    s.style.width = size+"px";
    s.style.height = size+"px";

    s.x = Math.random()*window.innerWidth;
    s.y = Math.random()*window.innerHeight;

    s.style.left = s.x+"px";
    s.style.top = s.y+"px";

    s.style.opacity = Math.random()*0.4 + 0.1;

    stars.push(s);
    starContainer.appendChild(s);
  }
}

createStars();

function updateStars(){
  for(let s of stars){
    s.x += 0.01;
    if(s.x > window.innerWidth){
      s.x = 0;
      s.y = Math.random()*window.innerHeight;
    }
    s.style.left = s.x+"px";
  }
  requestAnimationFrame(updateStars);
}

updateStars();

</script>

</body>
</html>
