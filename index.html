<!DOCTYPE html>
<html>
<body style="margin:0;background:#121212;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  createStars();
}
window.addEventListener("resize", resize);

// 🌟 STAR FIELD
let stars = [];

function createStars(){
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 6000);

  for(let i=0;i<count;i++){
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 1 + Math.random() * 2,
      speed: 0.03 + Math.random() * 0.05
    });
  }
}

resize();

function getPhase(){
  const t = Date.now() / 1000;
  return (t % 20) / 20;
}

function drawStars(){
  for(let s of stars){
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();

    s.x += s.speed;
    if(s.x > canvas.width) s.x = 0;
  }
}

function draw(){
  const w = canvas.width;
  const h = canvas.height;

  const cx = w/2;
  const cy = h/2;
  const r = Math.min(w,h)*0.2;

  // 🌌 SKY
  const sky = ctx.createRadialGradient(
    cx, cy, r*0.5,
    cx, cy, Math.max(w,h)
  );
  sky.addColorStop(0, "#1a1a1a");
  sky.addColorStop(1, "#0f0f0f");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,w,h);

  // 🌟 STARS (NOW WILL SHOW)
  drawStars();

  // 🌙 HALO
  const halo = ctx.createRadialGradient(cx, cy, r*0.8, cx, cy, r*2.2);
  halo.addColorStop(0, "rgba(200,200,200,0.08)");
  halo.addColorStop(1, "rgba(0,0,0,0)");

  ctx.beginPath();
  ctx.arc(cx, cy, r*2.2, 0, Math.PI*2);
  ctx.fillStyle = halo;
  ctx.fill();

  // 🌙 DRAW MOON IN ISOLATION
  ctx.save();

  // clip ONLY moon
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.clip();

  // moon shading
  const base = ctx.createRadialGradient(
    cx - r*0.35, cy - r*0.35, r*0.2,
    cx, cy, r
  );
  base.addColorStop(0, "#eee");
  base.addColorStop(0.5, "#bbb");
  base.addColorStop(1, "#666");

  ctx.fillStyle = base;
  ctx.fillRect(cx - r, cy - r, r*2, r*2);

  // phase shadow
  const phase = getPhase();

  ctx.fillStyle = "#121212";
  ctx.beginPath();

  ctx.ellipse(
    cx + (phase - 0.5) * 2 * r,
    cy,
    r,
    r * (0.6 + 0.4 * Math.abs(phase - 0.5)),
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();
}

function loop(){
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
