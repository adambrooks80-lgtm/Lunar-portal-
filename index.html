<!DOCTYPE html>
<html>
<body style="margin:0;background:#121212;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// stable random
let seed = 12345;
function rand(){
  seed = (seed * 16807) % 2147483647;
  return seed / 2147483647;
}

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  createStars();
}
window.addEventListener("resize", resize);

// 🌟 STAR FIELD (FORCED VISIBILITY)
let stars = [];

function createStars(){
  stars = [];
  seed = 12345;

  const count = Math.floor((canvas.width * canvas.height) / 8000); // many more

  for(let i=0;i<count;i++){
    stars.push({
      x: rand() * canvas.width,
      y: rand() * canvas.height,
      size: 1 + rand() * 2.5, // BIG
      speed: 0.02 + rand() * 0.04
    });
  }
}

resize();

function getPhase(){
  const t = Date.now() / 1000;
  return (t % 20) / 20;
}

function drawStars(){
  for(let s of stars){

    // MUCH brighter
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();

    s.x += s.speed;
    if(s.x > canvas.width) s.x = 0;
  }
}

function draw(){
  const w = canvas.width;
  const h = canvas.height;

  const cx = w/2;
  const cy = h/2;
  const r = Math.min(w,h)*0.2;

  // SKY
  const sky = ctx.createRadialGradient(
    cx, cy, r*0.5,
    cx, cy, Math.max(w,h)
  );
  sky.addColorStop(0, "#1a1a1a");
  sky.addColorStop(1, "#0f0f0f");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,w,h);

  // STARS (should now be obvious)
  drawStars();

  // HALO
  const halo = ctx.createRadialGradient(cx, cy, r*0.8, cx, cy, r*2.2);
  halo.addColorStop(0, "rgba(200,200,200,0.06)");
  halo.addColorStop(1, "rgba(0,0,0,0)");

  ctx.beginPath();
  ctx.arc(cx, cy, r*2.2, 0, Math.PI*2);
  ctx.fillStyle = halo;
  ctx.fill();

  // MOON
  ctx.save();

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.clip();

  const base = ctx.createRadialGradient(
    cx - r*0.35, cy - r*0.35, r*0.2,
    cx, cy, r
  );
  base.addColorStop(0, "#eee");
  base.addColorStop(0.5, "#bbb");
  base.addColorStop(1, "#666");

  ctx.fillStyle = base;
  ctx.fillRect(cx - r, cy - r, r*2, r*2);

  const phase = getPhase();

  ctx.fillStyle = "#121212";
  ctx.beginPath();

  ctx.ellipse(
    cx + (phase - 0.5) * 2 * r,
    cy,
    r,
    r * (0.6 + 0.4 * Math.abs(phase - 0.5)),
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();
}

function loop(){
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
