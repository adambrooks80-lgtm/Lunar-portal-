<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<!-- 🌌 SKY -->
<div id="skyWrap">
  <div id="stars"></div>
  <div id="moonGlowStatic"></div>
</div>

<!-- 🌙 MOON -->
<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">

    <!-- SURFACE -->
    <div id="moonSurface" style="
      position:absolute;
      width:100%;
      height:100%;
      background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
      background-size:cover;
      z-index:1;
    "></div>

    <!-- DEPTH -->
    <div id="moonDepth" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      pointer-events:none;
      z-index:2;
    "></div>

    <!-- SHADOW -->
    <div id="shadowMain" style="
      position:absolute;
      width:120%;
      height:120%;
      top:-10%;
      left:-10%;
      border-radius:50%;
      background:black;
      z-index:3;

      -webkit-mask-image: radial-gradient(circle,
        rgba(0,0,0,1) 50%,
        rgba(0,0,0,0.9) 52%,
        rgba(0,0,0,0.6) 54%,
        rgba(0,0,0,0.25) 56%,
        rgba(0,0,0,0.08) 58%,
        rgba(0,0,0,0) 60%
      );

      mask-image: radial-gradient(circle,
        rgba(0,0,0,1) 50%,
        rgba(0,0,0,0.9) 52%,
        rgba(0,0,0,0.6) 54%,
        rgba(0,0,0,0.25) 56%,
        rgba(0,0,0,0.08) 58%,
        rgba(0,0,0,0) 60%
      );
    "></div>

  </div>

</div>

<style>

#skyWrap{
  position:absolute;
  width:100%;
  height:100%;
}

#stars{
  position:absolute;
  width:100%;
  height:100%;
}

#moonGlowStatic{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}

.star{
  position:absolute;
  background:white;
  border-radius:50%;
}

</style>

<script>

const cycle = 12000;
const start = Date.now();

const shadowMain = document.getElementById("shadowMain");
const moonDepth = document.getElementById("moonDepth");
const moonSurface = document.getElementById("moonSurface");
const moonGlowStatic = document.getElementById("moonGlowStatic");

// ⭐ stars
const starContainer = document.getElementById("stars");

for(let i=0;i<100;i++){
  const s = document.createElement("div");
  s.className = "star";

  const size = Math.random()*1.4 + 0.4;
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  starContainer.appendChild(s);
}

function update(){

  const now = Date.now();
  const elapsed = now - start;

  const phase = (elapsed % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const illum = (1 - Math.cos(angle)) / 2;

  const moonRadius = 130;
  const shadowRadius = 150;
  const travel = moonRadius + shadowRadius;

  const offset = Math.cos(angle) * travel;

  // 🌑 shadow movement
  shadowMain.style.transform = `translateX(${offset}px)`;

  // 🌙 depth (subtle sphere feel)
  moonDepth.style.background = `
    radial-gradient(circle at 50% 50%,
      rgba(255,255,255,${0.05 * illum}) 0%,
      rgba(255,255,255,${0.02 * illum}) 40%,
      rgba(0,0,0,0.12) 100%
    )
  `;

  // 🌙 surface brightness
  moonSurface.style.filter =
    `brightness(${0.9 + illum * 0.18}) contrast(1.08)`;

  // 🌌 STATIC GLOW (corrected — no ring)
  moonGlowStatic.style.background = `
    radial-gradient(circle at 50% 50%,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,${0.035 * illum}) 18%,
      rgba(255,255,255,${0.02 * illum}) 40%,
      rgba(255,255,255,0) 80%
    )
  `;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
