<!DOCTYPE html>
<html>
<body style="margin:0;background:#1a1a1a;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// fixed phase for now
const phase = 0.25;

// stable texture (generated once)
let craters = [];
function createTexture(){
  const r = Math.min(canvas.width, canvas.height)*0.18;

  craters = [];
  for(let i=0;i<40;i++){
    craters.push({
      x: (Math.random()-0.5)*r*1.4,
      y: (Math.random()-0.5)*r*1.4,
      size: Math.random()*r*0.04
    });
  }
}
createTexture();

function draw(){
  const w = canvas.width;
  const h = canvas.height;

  const cx = w/2;
  const cy = h/2;
  const r = Math.min(w,h)*0.18;

  // sky (not pure black)
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(0,0,w,h);

  // moon base
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = "#d0d0d0";
  ctx.fill();

  // shadow (soft — not destructive)
  const shift = Math.cos(phase * Math.PI * 2) * r;

  ctx.globalCompositeOperation = "multiply";
  ctx.beginPath();
  ctx.arc(cx + shift, cy, r, 0, Math.PI*2);
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";

  // texture (stable — no spinning)
  ctx.globalAlpha = 0.05;
  for(let c of craters){
    ctx.beginPath();
    ctx.arc(cx + c.x, cy + c.y, c.size, 0, Math.PI*2);
    ctx.fillStyle = "black";
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
