<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<div id="skyWrap">
  <div id="milkyway"></div>
  <div id="stars"></div>
</div>

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:260px;
  height:260px;
">

  <!-- 🌙 MOON -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
  "></div>

  <!-- 🌗 SHADOW (SOLID — no gradient) -->
  <div id="shadow" style="
    position:absolute;
    width:140%;
    height:140%;
    top:-20%;
    left:-20%;
    border-radius:50%;
    background:black;
    opacity:0.9;
  "></div>

  <!-- 🌙 subtle edge glow -->
  <div id="edgeGlow" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow:0 0 4px rgba(255,255,255,0.15);
    pointer-events:none;
  "></div>

</div>

<style>
#skyWrap { position:absolute; width:100%; height:100%; }
#milkyway {
  position:absolute;
  width:100%;
  height:100%;
  background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.05), transparent 60%);
}
#stars { position:absolute; width:100%; height:100%; }
.star { position:absolute; background:white; border-radius:50%; }
</style>

<script>

// 🌙 CLOCK
const cycle = 12000;
const start = Date.now();

const shadow = document.getElementById("shadow");

// ⭐ stars
const starContainer = document.getElementById("stars");

for(let i=0;i<100;i++){
  const s = document.createElement("div");
  s.className = "star";
  const size = Math.random()*1.5 + 0.5;

  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  starContainer.appendChild(s);
}

function update(){

  const phase = ((Date.now() - start) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  // 🔥 FULL TRAVEL — no ring artifact
  const offset = Math.cos(angle) * 260;

  shadow.style.transform = `translateX(${offset}px)`;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
