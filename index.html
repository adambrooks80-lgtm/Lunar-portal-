<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<!-- SKY -->
<div id="skyWrap">
  <div id="stars"></div>
</div>

<div id="ambient"></div>

<!-- MOON -->
<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <!-- MOON SURFACE -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    z-index:2;
  "></div>

  <!-- LIGHT SIDE BOOST -->
  <div id="lightLayer" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:white;
    opacity:0;
    mix-blend-mode:screen;
    z-index:3;
  "></div>

  <!-- EARTHSHINE -->
  <div id="earthshine" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:white;
    opacity:0;
    mix-blend-mode:screen;
    z-index:1;
  "></div>

  <!-- 🌗 SHADOW STACK (soft edge, no blur) -->
  <div id="shadow1" class="shadow"></div>
  <div id="shadow2" class="shadow"></div>
  <div id="shadow3" class="shadow"></div>

</div>

<style>

#skyWrap{
  position:absolute;
  width:100%;
  height:100%;
}

#stars{
  position:absolute;
  width:100%;
  height:100%;
}

.star{
  position:absolute;
  background:white;
  border-radius:50%;
}

.shadow{
  position:absolute;
  width:120%;
  height:120%;
  top:-10%;
  left:-10%;
  border-radius:50%;
  background:black;
  z-index:4;
}

#shadow1{ opacity:0.9; }
#shadow2{ opacity:0.25; }
#shadow3{ opacity:0.1; }

#ambient{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}

</style>

<script>

// 🌙 CLOCK
const cycle = 12000;
const start = Date.now();

const s1 = document.getElementById("shadow1");
const s2 = document.getElementById("shadow2");
const s3 = document.getElementById("shadow3");

const lightLayer = document.getElementById("lightLayer");
const earthshine = document.getElementById("earthshine");
const moonWrap = document.getElementById("moonWrap");
const skyWrap = document.getElementById("skyWrap");
const ambient = document.getElementById("ambient");

// ⭐ STARS
const stars = [];
const starContainer = document.getElementById("stars");

for(let i=0;i<90;i++){
  const s = document.createElement("div");
  s.className = "star";

  const size = Math.random()*1.4 + 0.4;
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  stars.push(s);
  starContainer.appendChild(s);
}

function update(){

  const phase = ((Date.now() - start) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  // 🌙 correct travel distance (FIXED)
  const moonRadius = 130;
  const shadowRadius = 156; // 120% of moon
  const travel = moonRadius + shadowRadius;

  const offset = Math.cos(angle) * travel;

  // 🌗 layered soft shadow
  s1.style.transform = `translateX(${offset}px)`;
  s2.style.transform = `translateX(${offset + 3}px)`;
  s3.style.transform = `translateX(${offset + 6}px)`;

  // 🌙 tilt (UK feel)
  const tilt = 12 + Math.sin(angle * 0.5) * 6;
  moonWrap.style.transform =
    `translate(-50%,-50%) rotate(${tilt}deg)`;

  // 🌌 sky rotation
  skyWrap.style.transform =
    `rotate(${phase * 360}deg)`;

  // ⭐ twinkle
  for(let s of stars){
    s.style.opacity += (Math.random()-0.5)*0.008;
    s.style.opacity = Math.max(0.1, Math.min(0.7, s.style.opacity));
  }

  const illum = (1 - Math.cos(angle)) / 2;

  // 🌙 light boost
  lightLayer.style.opacity = illum * 0.08;
  lightLayer.style.transform =
    `translateX(${offset * 0.2}px)`;

  // 🌑 earthshine
  earthshine.style.opacity = (1 - illum) * 0.08;

  // ✨ subtle full/new moon magic
  const fullBoost = Math.pow(illum, 6);
  const newBoost  = Math.pow(1 - illum, 6);

  ambient.style.background = `
    radial-gradient(circle at center,
      rgba(255,255,255,${fullBoost * 0.05}),
      rgba(100,120,255,${newBoost * 0.05}),
      transparent 70%
    )
  `;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
