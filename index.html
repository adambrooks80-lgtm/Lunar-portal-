<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<div id="skyWrap">
  <div id="milkyway"></div>
  <div id="stars"></div>
</div>

<div id="haze"></div>
<div id="shootingStars"></div>

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <!-- 🌙 EDGE GLOW -->
  <div id="edgeGlow" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    pointer-events:none;
    box-shadow:
      0 0 8px rgba(255,255,255,0.25),
      0 0 18px rgba(255,255,255,0.15);
  "></div>

  <!-- 🌙 MOON -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    filter:hue-rotate(200deg) saturate(0.7);
  "></div>

  <!-- 🌑 EARTHSHINE -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    opacity:0.08;
  "></div>

  <!-- 🌗 TERMINATOR -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">
    <div id="mask" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(
        circle,
        rgba(0,0,0,0.92) 55%,
        rgba(0,0,0,0.6) 65%,
        rgba(0,0,0,0.3) 75%,
        rgba(0,0,0,0.1) 85%,
        transparent 100%
      );
      filter: blur(3px);
    "></div>
  </div>

</div>

<style>
#skyWrap { position:absolute; width:100%; height:100%; }
#milkyway {
  position:absolute;
  width:100%;
  height:100%;
  background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.05), transparent 60%);
}
#stars { position:absolute; width:100%; height:100%; }
.star { position:absolute; background:white; border-radius:50%; }
#haze, #shootingStars {
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}
.shooting-star {
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  box-shadow:0 0 6px white;
}
</style>

<script>

// 🌙 MASTER CLOCK
let demo = true;
const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 12000;

const cycle = demo ? demoCycle : realCycle;
const start = Date.now();

const mask = document.getElementById("mask");
const moonWrap = document.getElementById("moonWrap");
const skyWrap = document.getElementById("skyWrap");
const edgeGlow = document.getElementById("edgeGlow");

const stars = [];
const starContainer = document.getElementById("stars");

// ⭐ stars
for(let i=0;i<100;i++){
  const s = document.createElement("div");
  const size = Math.random()*1.8 + 0.4;

  s.className = "star";
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.x = Math.random()*window.innerWidth;
  s.y = Math.random()*window.innerHeight;

  s.style.left = s.x+"px";
  s.style.top = s.y+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  stars.push(s);
  starContainer.appendChild(s);
}

function update(){

  const elapsed = Date.now() - start;
  const phase = (elapsed % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  // 🌗 phase movement
  const offset = Math.cos(angle) * 260;
  mask.style.transform = `translateX(${offset}px)`;

  // 🌙 tilt
  const tilt = Math.sin(angle * 0.5) * 8;
  moonWrap.style.transform =
    `translate(-50%,-50%) rotate(${12 + tilt}deg)`;

  // 🌌 sky rotation
  skyWrap.style.transform =
    `rotate(${phase * 360}deg)`;

  // ⭐ twinkle
  for(let s of stars){
    s.style.opacity += (Math.random()-0.5)*0.01;
    s.style.opacity = Math.max(0.1, Math.min(0.6, s.style.opacity));
  }

  // 🌙 EDGE GLOW reacts to phase
  const illumination = (1 - Math.cos(angle)) / 2;

  edgeGlow.style.boxShadow = `
    0 0 ${6 + illumination * 10}px rgba(255,255,255,${0.15 + illumination * 0.25}),
    0 0 ${12 + illumination * 20}px rgba(255,255,255,${0.08 + illumination * 0.15})
  `;

  requestAnimationFrame(update);
}

update();


// 🌫️ haze
const haze = document.getElementById("haze");
haze.style.background = `
  radial-gradient(circle at 30% 40%, rgba(255,255,255,0.03), transparent 70%),
  radial-gradient(circle at 70% 60%, rgba(255,255,255,0.02), transparent 70%)
`;

let h = 0;
function updateHaze(){
  h += 0.002;
  haze.style.transform = `translateX(${Math.sin(h)*10}px)`;
  requestAnimationFrame(updateHaze);
}
updateHaze();


// ✨ shooting stars unchanged
const shootingContainer = document.getElementById("shootingStars");

function createShootingStar(){
  const star = document.createElement("div");
  star.className = "shooting-star";

  const startX = Math.random()*window.innerWidth;
  const startY = Math.random()*window.innerHeight * 0.5;

  star.style.left = startX+"px";
  star.style.top = startY+"px";

  shootingContainer.appendChild(star);

  let x = startX;
  let y = startY;
  const speed = 8 + Math.random()*4;

  function animate(){
    x += speed;
    y += speed * 0.5;

    star.style.left = x+"px";
    star.style.top = y+"px";
    star.style.opacity = 1 - (x - startX)/300;

    if(star.style.opacity <= 0){
      star.remove();
      return;
    }

    requestAnimationFrame(animate);
  }

  animate();
}

function shootingLoop(){
  const delay = 6000 + Math.random()*12000;
  setTimeout(()=>{
    createShootingStar();
    shootingLoop();
  }, delay);
}

shootingLoop();

</script>

</body>
</html>
