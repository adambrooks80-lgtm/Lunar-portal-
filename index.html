<!DOCTYPE html>
<html>
<body style="margin:0;background:black;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// try values 0 → 1
const phase = 0.25;

function draw(){
  const w = canvas.width;
  const h = canvas.height;

  const cx = w / 2;
  const cy = h / 2;
  const r = 120;

  ctx.fillStyle = "black";
  ctx.fillRect(0,0,w,h);

  // convert phase to -1 → 1
  const t = Math.cos(phase * Math.PI * 2);

  // offset controls width
  const offset = t * r * 0.9;

  ctx.beginPath();

  // outer curve (perfect circle)
  ctx.arc(cx, cy, r, Math.PI/2, Math.PI*1.5);

  // inner curve (slightly adjusted radius fixes flattening)
  ctx.arc(cx + offset, cy, r * 0.98, Math.PI*1.5, Math.PI/2, true);

  ctx.closePath();

  ctx.fillStyle = "#dddddd";
  ctx.fill();
}

draw();
</script>
</body>
</html>
