<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  overflow:hidden;
  height:100vh;
">

<!-- 🌙 MOON -->
<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <!-- 🌫️ HALO -->
  <div id="halo" style="
    position:absolute;
    width:150%;
    height:150%;
    top:-25%;
    left:-25%;
    border-radius:50%;
    background: radial-gradient(
      circle at 60% 50%,
      rgba(255,255,255,0.15),
      rgba(255,255,255,0.05) 35%,
      transparent 75%
    );
    filter: blur(20px);
  "></div>

  <!-- 🌙 SURFACE -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
  "></div>

  <!-- 🌗 SHADOW (single mask, correct) -->
  <div id="shadow" style="
    position:absolute;
    width:140%;
    height:140%;
    top:-20%;
    left:-20%;
    border-radius:50%;
    background:rgba(0,0,0,0.85);
    filter: blur(3px);
  "></div>

  <!-- 🌙 faint dark detail -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    opacity:0.1;
    mix-blend-mode:lighten;
  "></div>

</div>

<script>

// 🌙 PHASE SYSTEM (correct + bright)
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 12000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const shadow = document.getElementById("shadow");
const halo = document.getElementById("halo");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  // FULL TRAVEL (no half-stop)
  const offset = Math.cos(angle) * 260;

  shadow.style.transform = `translateX(${offset}px)`;

  // halo follows light
  halo.style.transform = `translateX(${offset * 0.1}px)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();

</script>

</body>
</html>
