<!DOCTYPE html>
<html>
<body style="margin:0;background:#000;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = 400;
canvas.height = 400;

// draw background
ctx.fillStyle = "red";
ctx.fillRect(0, 0, 400, 400);

// draw circle
ctx.fillStyle = "lime";
ctx.beginPath();
ctx.arc(200, 200, 100, 0, Math.PI * 2);
ctx.fill();
</script>
</body>
</html>
