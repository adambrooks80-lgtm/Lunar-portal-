<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
">

<div id="moonWrap" style="
  position:relative;
  width:260px;
  height:260px;
">

  <!-- glow -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow: 0 0 100px 30px rgba(200,200,200,0.12);
  "></div>

  <!-- 🌙 base moon -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size: cover;
  "></div>

  <!-- 🌗 shadow shape -->
  <div id="shadow" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background: rgba(0,0,0,0.85);
    transform:translateX(80px);
    filter: blur(6px); /* 👈 key softness */
  "></div>

  <!-- 🌙 shadow detail (faint texture in dark side) -->
  <div id="darkTexture" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size: cover;
    opacity:0.15;
    mix-blend-mode: lighten;
  "></div>

</div>

<script>
// 🌙 phase
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 10000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const shadow = document.getElementById("shadow");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;

  const offset = Math.cos(phase * Math.PI * 2);

  shadow.style.transform = `translateX(${offset * 130}px)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();
</script>

</body>
</html>
