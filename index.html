<!DOCTYPE html>
<html>
<body style="margin:0;background:#121212;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// stable random
let seed = 12345;
function rand(){
  seed = (seed * 16807) % 2147483647;
  return seed / 2147483647;
}

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  createStars();
}
window.addEventListener("resize", resize);

// 🌟 STARS
let stars = [];

function createStars(){
  stars = [];
  seed = 12345;

  const count = Math.floor((canvas.width * canvas.height) / 14000);

  for(let i=0;i<count;i++){
    stars.push({
      x: rand() * canvas.width,
      y: rand() * canvas.height,
      size: 0.6 + rand() * 1.2,
      speedX: 0.015 + rand() * 0.01,
      speedY: (rand() - 0.5) * 0.01
    });
  }
}

resize();

// 🌗 PHASE
function getPhase(){
  const t = Date.now() / 1000;
  return (t % 20) / 20;
}

// ☀️ FAST DAY/NIGHT (1 min cycle)
function getDayFactor(){
  const t = Date.now() / 1000;
  return 0.5 + 0.5 * Math.cos((t % 60) / 60 * Math.PI * 2);
}

// 🌟 STARS
function drawStars(dayFactor){
  const opacity = 0.32 * (1 - dayFactor);

  for(let s of stars){
    ctx.fillStyle = `rgba(255,255,255,${opacity})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();

    s.x += s.speedX;
    s.y += s.speedY;

    if(s.x > canvas.width) s.x = 0;
    if(s.x < 0) s.x = canvas.width;
    if(s.y > canvas.height) s.y = 0;
    if(s.y < 0) s.y = canvas.height;
  }
}

function draw(){
  const w = canvas.width;
  const h = canvas.height;

  const cx = w/2;
  const cy = h/2;
  const r = Math.min(w,h)*0.2;

  const dayFactor = getDayFactor();

  // 🌌 SKY
  const sky = ctx.createRadialGradient(
    cx, cy, r*0.5,
    cx, cy, Math.max(w,h)
  );

  const baseDark = 15 + dayFactor * 15;
  sky.addColorStop(0, `rgb(${baseDark+10},${baseDark+10},${baseDark+10})`);
  sky.addColorStop(1, `rgb(${baseDark},${baseDark},${baseDark})`);

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,w,h);

  // 🌟 STARS
  drawStars(dayFactor);

  // 🌙 HALO
  const haloStrength = 0.06 * (1 - dayFactor * 0.6);

  const halo = ctx.createRadialGradient(cx, cy, r*0.8, cx, cy, r*2.2);
  halo.addColorStop(0, `rgba(200,200,200,${haloStrength})`);
  halo.addColorStop(1, "rgba(0,0,0,0)");

  ctx.beginPath();
  ctx.arc(cx, cy, r*2.2, 0, Math.PI*2);
  ctx.fillStyle = halo;
  ctx.fill();

  // 🌙 MOON
  ctx.save();

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.clip();

  const base = ctx.createRadialGradient(
    cx - r*0.35, cy - r*0.35, r*0.2,
    cx, cy, r
  );

  const brightness = 220 - dayFactor * 60;

  base.addColorStop(0, `rgb(${brightness},${brightness},${brightness})`);
  base.addColorStop(0.5, `rgb(${brightness-50},${brightness-50},${brightness-50})`);
  base.addColorStop(1, `rgb(${brightness-120},${brightness-120},${brightness-120})`);

  ctx.fillStyle = base;
  ctx.fillRect(cx - r, cy - r, r*2, r*2);

  const phase = getPhase();

  ctx.fillStyle = "#121212";
  ctx.beginPath();

  ctx.ellipse(
    cx + (phase - 0.5) * 2 * r,
    cy,
    r,
    r * (0.6 + 0.4 * Math.abs(phase - 0.5)),
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();
}

function loop(){
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
