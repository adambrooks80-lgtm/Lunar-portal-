<!DOCTYPE html>
<html>
<body style="margin:0;background:#121212;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// 🌗 FIXED TEST PHASE (so we can SEE it clearly)
const phase = 0.25; // try changing this later

function draw(){
  const w = canvas.width;
  const h = canvas.height;

  const cx = w/2;
  const cy = h/2;
  const r = Math.min(w,h)*0.18;

  // SKY
  ctx.fillStyle = "#121212";
  ctx.fillRect(0,0,w,h);

  // 🌙 CREATE CRESCENT USING CLIPPING
  ctx.save();

  // full moon circle
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.clip();

  // draw full lit moon
  ctx.fillStyle = "#bbb";
  ctx.fillRect(cx - r, cy - r, r*2, r*2);

  // cut shadow using second circle
  const offset = Math.cos(phase * Math.PI * 2) * r;

  ctx.globalCompositeOperation = "destination-out";

  ctx.beginPath();
  ctx.arc(cx + offset, cy, r, 0, Math.PI*2);
  ctx.fill();

  ctx.globalCompositeOperation = "source-over";

  ctx.restore();

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
