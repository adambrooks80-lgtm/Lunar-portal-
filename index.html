<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
">

<!-- ⭐ STARS -->
<div id="stars"></div>

<!-- 🌙 MOON -->
<div id="moonWrap" style="
  position:relative;
  width:260px;
  height:260px;
">

  <!-- glow -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow: 0 0 100px 30px rgba(200,200,200,0.12);
  "></div>

  <!-- moon base -->
  <div id="moonSurface" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #eeeeee, #bbbbbb 60%, #666666);
    overflow:hidden;
  "></div>

  <!-- 🌗 shadow -->
  <div id="shadow" style="
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    border-radius:50%;
    transform:translateX(80px);
  "></div>

</div>

<script>
// --------------------
// 🌙 PHASE
// --------------------
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 10000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const shadow = document.getElementById("shadow");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;
  const offset = Math.cos(phase * Math.PI * 2);

  shadow.style.transform = `translateX(${offset * 130}px)`;

  requestAnimationFrame(updateMoon);
}
updateMoon();

// --------------------
// 🌙 TEXTURE (craters)
// --------------------
const surface = document.getElementById("moonSurface");

function addCraters(){
  for(let i=0;i<40;i++){
    const crater = document.createElement("div");

    const size = Math.random() * 30 + 10;

    crater.style.position = "absolute";
    crater.style.width = size + "px";
    crater.style.height = size + "px";
    crater.style.borderRadius = "50%";

    crater.style.left = Math.random()*220 + "px";
    crater.style.top = Math.random()*220 + "px";

    crater.style.background = "radial-gradient(circle, rgba(0,0,0,0.2), transparent)";
    crater.style.opacity = 0.3;

    surface.appendChild(crater);
  }
}

addCraters();

// --------------------
// ⭐ STARS
// --------------------
const starContainer = document.getElementById("stars");

let stars = [];

function createStars(){
  for(let i=0;i<120;i++){
    const star = document.createElement("div");

    const size = Math.random()*2+1;

    star.style.position = "absolute";
    star.style.width = size+"px";
    star.style.height = size+"px";
    star.style.background = "white";
    star.style.borderRadius = "50%";

    star.x = Math.random()*window.innerWidth;
    star.y = Math.random()*window.innerHeight;

    star.style.left = star.x + "px";
    star.style.top = star.y + "px";

    star.style.opacity = Math.random()*0.5 + 0.3;

    stars.push(star);
    starContainer.appendChild(star);
  }
}

createStars();

// slow drift
function updateStars(){
  for(let s of stars){
    s.x += 0.02;

    if(s.x > window.innerWidth){
      s.x = 0;
      s.y = Math.random()*window.innerHeight;
    }

    s.style.left = s.x + "px";
  }

  requestAnimationFrame(updateStars);
}

updateStars();
</script>

</body>
</html>
