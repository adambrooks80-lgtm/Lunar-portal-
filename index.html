<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<!-- SKY -->
<div id="skyWrap">
  <div id="stars"></div>
</div>

<div id="ambient"></div>

<!-- MOON -->
<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <!-- CLIPPED MOON -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">

    <!-- MOON SURFACE -->
    <div id="moonSurface" style="
      position:absolute;
      width:100%;
      height:100%;
      background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
      background-size:cover;
    "></div>

    <!-- EARTHSHINE -->
    <div id="earthshine" style="
      position:absolute;
      width:100%;
      height:100%;
      background:white;
      opacity:0;
      mix-blend-mode:screen;
    "></div>

    <!-- SHADOW -->
    <div id="shadowMain" style="
      position:absolute;
      width:120%;
      height:120%;
      top:-10%;
      left:-10%;
      border-radius:50%;
      background:black;
      opacity:0.85;
    "></div>

    <div id="shadowSoft" style="
      position:absolute;
      width:126%;
      height:126%;
      top:-13%;
      left:-13%;
      border-radius:50%;
      background:black;
      opacity:0.2;
    "></div>

  </div>

</div>

<style>
#skyWrap{ position:absolute; width:100%; height:100%; }
#stars{ position:absolute; width:100%; height:100%; }

.star{
  position:absolute;
  background:white;
  border-radius:50%;
}

#ambient{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}
</style>

<script>

const cycle = 12000;
const start = Date.now();

const shadowMain = document.getElementById("shadowMain");
const shadowSoft = document.getElementById("shadowSoft");
const earthshine = document.getElementById("earthshine");
const moonWrap = document.getElementById("moonWrap");
const moonSurface = document.getElementById("moonSurface");
const skyWrap = document.getElementById("skyWrap");
const ambient = document.getElementById("ambient");

// STARS
const stars = [];
const starContainer = document.getElementById("stars");

for(let i=0;i<100;i++){
  const s = document.createElement("div");
  s.className = "star";

  const size = Math.random()*1.4 + 0.4;
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  stars.push(s);
  starContainer.appendChild(s);
}

function update(){

  const phase = ((Date.now() - start) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const moonRadius = 130;
  const shadowRadius = 156;
  const travel = moonRadius + shadowRadius;

  const offset = Math.cos(angle) * travel;

  // SHADOW
  shadowMain.style.transform = `translateX(${offset}px)`;
  shadowSoft.style.transform = `translateX(${offset}px) scale(1.02)`;

  // ROTATION + TILT
  const rotation = angle * 0.1;
  const tilt = 12 + Math.sin(angle * 0.5) * 6;

  moonWrap.style.transform =
    `translate(-50%,-50%) rotate(${tilt}deg)`;

  moonSurface.style.transform =
    `rotate(${rotation}deg)`;

  // SKY
  skyWrap.style.transform =
    `rotate(${phase * 360}deg)`;

  // TWINKLE
  for(let s of stars){
    s.style.opacity += (Math.random()-0.5)*0.008;
    s.style.opacity = Math.max(0.1, Math.min(0.7, s.style.opacity));
  }

  const illum = (1 - Math.cos(angle)) / 2;

  // EARTHSHINE
  earthshine.style.opacity = (1 - illum) * 0.08;

  // 🌙 subtle limb brightening via contrast (NOT glow)
  moonSurface.style.filter =
    `contrast(${1 + illum * 0.25}) brightness(${0.9 + illum * 0.2})`;

  // MAGIC
  const fullBoost = Math.pow(illum, 6);
  const newBoost  = Math.pow(1 - illum, 6);

  ambient.style.background = `
    radial-gradient(circle at center,
      rgba(255,255,255,${fullBoost * 0.04}),
      rgba(100,120,255,${newBoost * 0.04}),
      transparent 70%
    )
  `;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
