<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
">

<!-- ⭐ STARS -->
<div id="stars"></div>

<!-- 🌙 MOON -->
<div id="moonWrap" style="
  position:relative;
  width:260px;
  height:260px;
">

  <!-- glow -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow: 0 0 100px 30px rgba(200,200,200,0.12);
  "></div>

  <!-- 🌙 texture -->
  <div id="moonSurface" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size: cover;
    filter: brightness(1.05) contrast(1.1);
  ">

    <!-- 🌗 directional lighting -->
    <div id="lighting" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25), rgba(0,0,0,0.5));
      mix-blend-mode: overlay;
    "></div>

    <!-- 🌙 limb darkening (THIS adds roundness) -->
    <div style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.6));
      opacity:0.7;
    "></div>

  </div>

  <!-- 🌗 terminator -->
  <div id="terminator" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background: radial-gradient(circle at center, transparent 55%, black 85%);
    opacity:0.7;
    transform:translateX(80px);
  "></div>

</div>

<script>
// 🌙 phase
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 10000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const terminator = document.getElementById("terminator");
const lighting = document.getElementById("lighting");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;

  const offset = Math.cos(phase * Math.PI * 2);

  // move shadow
  terminator.style.transform = `translateX(${offset * 130}px)`;

  // move light direction (THIS is subtle but powerful)
  const lightX = 50 + offset * 30;
  lighting.style.background = `
    radial-gradient(circle at ${lightX}% 30%, rgba(255,255,255,0.25), rgba(0,0,0,0.5))
  `;

  requestAnimationFrame(updateMoon);
}

updateMoon();

// ⭐ stars
const starContainer = document.getElementById("stars");
let stars = [];

function createStars(){
  for(let i=0;i<120;i++){
    const star = document.createElement("div");

    const size = Math.random()*2+1;

    star.style.position = "absolute";
    star.style.width = size+"px";
    star.style.height = size+"px";
    star.style.background = "white";
    star.style.borderRadius = "50%";

    star.x = Math.random()*window.innerWidth;
    star.y = Math.random()*window.innerHeight;

    star.style.left = star.x + "px";
    star.style.top = star.y + "px";

    star.style.opacity = Math.random()*0.5 + 0.3;

    stars.push(star);
    starContainer.appendChild(star);
  }
}

createStars();

function updateStars(){
  for(let s of stars){
    s.x += 0.02;

    if(s.x > window.innerWidth){
      s.x = 0;
      s.y = Math.random()*window.innerHeight;
    }

    s.style.left = s.x + "px";
  }

  requestAnimationFrame(updateStars);
}

updateStars();
</script>

</body>
</html>
