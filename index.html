<!DOCTYPE html>
<html>
<body style="margin:0;background:#121212;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// --------------------
// Resize
// --------------------
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// --------------------
// STATIC STARS (no movement)
// --------------------
let stars = [];
for(let i=0;i<150;i++){
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 1.2
  });
}

// --------------------
// FIXED PHASE (NO CHANGE)
// --------------------
const fixedPhase = 0.3;

// --------------------
// DRAW
// --------------------
function draw(){
  const w = canvas.width;
  const h = canvas.height;

  const cx = w/2;
  const cy = h/2;
  const r = Math.min(w,h)*0.2;

  // SKY (static)
  ctx.fillStyle = "#121212";
  ctx.fillRect(0,0,w,h);

  // STARS (static)
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  for(let s of stars){
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();
  }

  // HALO
  const halo = ctx.createRadialGradient(cx, cy, r*0.8, cx, cy, r*2);
  halo.addColorStop(0, "rgba(200,200,200,0.05)");
  halo.addColorStop(1, "rgba(0,0,0,0)");

  ctx.beginPath();
  ctx.arc(cx, cy, r*2, 0, Math.PI*2);
  ctx.fillStyle = halo;
  ctx.fill();

  // MOON
  ctx.save();

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.clip();

  const base = ctx.createRadialGradient(
    cx - r*0.3, cy - r*0.3, r*0.2,
    cx, cy, r
  );

  base.addColorStop(0, "#ddd");
  base.addColorStop(0.5, "#aaa");
  base.addColorStop(1, "#555");

  ctx.fillStyle = base;
  ctx.fillRect(cx - r, cy - r, r*2, r*2);

  // LIGHT (fixed)
  const angle = (fixedPhase - 0.5) * Math.PI;
  const light = Math.sin(angle) * 0.3;

  ctx.fillStyle = "#121212";
  ctx.beginPath();
  ctx.ellipse(
    cx + light * r,
    cy,
    r,
    r,
    0,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.restore();

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
