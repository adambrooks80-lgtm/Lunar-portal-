<!DOCTYPE html>

<html>

<body style="margin:0;background:#121212;">

<canvas id="c"></canvas>

 

<script>

const canvas = document.getElementById("c");

const ctx = canvas.getContext("2d");

 

function resize(){

  canvas.width = window.innerWidth;

  canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize", resize);

 

function draw(){

  const w = canvas.width;

  const h = canvas.height;

 

  ctx.fillStyle = "#121212";

  ctx.fillRect(0,0,w,h);

 

  const cx = w/2;

  const cy = h/2;

  const r = Math.min(w,h)*0.2;

 

  // create radial gradient (fake moon texture)

  const grad = ctx.createRadialGradient(

    cx - r*0.3, cy - r*0.3, r*0.2,

    cx, cy, r

  );

 

  grad.addColorStop(0, "#ddd");

  grad.addColorStop(0.4, "#bbb");

  grad.addColorStop(1, "#777");

 

  ctx.beginPath();

  ctx.arc(cx, cy, r, 0, Math.PI*2);

  ctx.fillStyle = grad;

  ctx.fill();

 

  // soften contrast

  ctx.fillStyle = "rgba(0,0,0,0.2)";

  ctx.beginPath();

  ctx.arc(cx, cy, r, 0, Math.PI*2);

  ctx.fill();

 

  // edge fade

  const fade = ctx.createRadialGradient(cx, cy, r*0.7, cx, cy, r);

  fade.addColorStop(0, "rgba(0,0,0,1)");

  fade.addColorStop(1, "rgba(0,0,0,0)");

 

  ctx.globalCompositeOperation = "destination-in";

  ctx.fillStyle = fade;

  ctx.fillRect(0,0,w,h);

 

  ctx.globalCompositeOperation = "source-over";

}

 

draw();

</script>

 

</body>

</html>
