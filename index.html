<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
">

<div id="moonWrap" style="
  position:relative;
  width:260px;
  height:260px;
">

  <!-- glow -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    box-shadow: 0 0 100px 30px rgba(200,200,200,0.12);
  "></div>

  <!-- 🌙 texture -->
  <div id="moonSurface" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size: cover;
  ">

    <!-- 🌗 sharper light -->
    <div id="lighting" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(circle at 70% 50%, rgba(0,0,0,1) 45%, transparent 55%);
      mix-blend-mode: multiply;
    "></div>

    <!-- limb darkening -->
    <div style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(circle at center, transparent 70%, rgba(0,0,0,0.6));
    "></div>

  </div>

</div>

<script>
// 🌙 phase
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 10000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const lighting = document.getElementById("lighting");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;

  const x = 50 + Math.cos(phase * Math.PI * 2) * 40;

  lighting.style.background = `
    radial-gradient(circle at ${x}% 50%, rgba(0,0,0,1) 45%, transparent 55%)
  `;

  requestAnimationFrame(updateMoon);
}

updateMoon();
</script>

</body>
</html>
