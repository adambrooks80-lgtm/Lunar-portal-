<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<div id="milkyway"></div>
<div id="stars"></div>
<div id="haze"></div>
<div id="shootingStars"></div>

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <div id="halo" style="
    position:absolute;
    width:160%;
    height:160%;
    top:-30%;
    left:-30%;
    border-radius:50%;
    background: radial-gradient(
      circle at center,
      rgba(200,220,255,0.15),
      rgba(200,220,255,0.05) 35%,
      transparent 75%
    );
    filter: blur(25px);
  "></div>

  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    filter:hue-rotate(200deg) saturate(0.7);
  "></div>

  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    opacity:0.08;
  "></div>

  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">
    <div id="mask" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(
        circle,
        rgba(0,0,0,0.92) 55%,
        rgba(0,0,0,0.6) 65%,
        rgba(0,0,0,0.3) 75%,
        rgba(0,0,0,0.1) 85%,
        transparent 100%
      );
      filter: blur(3px);
    "></div>
  </div>

</div>

<style>
#milkyway, #stars, #haze, #shootingStars {
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}

.star {
  position:absolute;
  background:white;
  border-radius:50%;
}

.shooting-star {
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  box-shadow: 0 0 6px white;
}
</style>

<script>

// 🌙 Moon system
let demo = true;
const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 12000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const mask = document.getElementById("mask");
const halo = document.getElementById("halo");
const moonWrap = document.getElementById("moonWrap");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const offset = Math.cos(angle) * 260;

  mask.style.transform = `translateX(${offset}px)`;
  halo.style.transform = `translateX(${offset * 0.05}px)`;

  const tilt = Math.sin(angle * 0.5) * 8;
  moonWrap.style.transform =
    `translate(-50%,-50%) rotate(${12 + tilt}deg)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();


// 🌌 Milky Way (drifting WITH stars)
const milky = document.getElementById("milkyway");

milky.style.background =
  "radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.05), transparent 60%)";

let skyOffset = 0;


// ⭐ Stars
const starContainer = document.getElementById("stars");
let stars = [];

for(let i=0;i<100;i++){
  const s = document.createElement("div");
  const size = Math.random()*1.8 + 0.4;

  s.className = "star";
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.x = Math.random()*window.innerWidth;
  s.y = Math.random()*window.innerHeight;

  s.style.left = s.x+"px";
  s.style.top = s.y+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  stars.push(s);
  starContainer.appendChild(s);
}

function updateSky(){

  // 🌌 shared drift (stars + milky way)
  skyOffset += 0.003;

  milky.style.transform =
    `translateX(${skyOffset}px)`;

  for(let s of stars){
    s.x += 0.003;

    if(s.x > window.innerWidth){
      s.x = 0;
      s.y = Math.random()*window.innerHeight;
    }

    s.style.opacity += (Math.random()-0.5)*0.01;
    s.style.opacity = Math.max(0.1, Math.min(0.6, s.style.opacity));

    s.style.left = s.x+"px";
  }

  requestAnimationFrame(updateSky);
}

updateSky();


// 🌫️ haze
const haze = document.getElementById("haze");
haze.style.background = `
  radial-gradient(circle at 30% 40%, rgba(255,255,255,0.03), transparent 70%),
  radial-gradient(circle at 70% 60%, rgba(255,255,255,0.02), transparent 70%)
`;

let h = 0;
function updateHaze(){
  h += 0.002;
  haze.style.transform = `translateX(${Math.sin(h)*10}px)`;
  requestAnimationFrame(updateHaze);
}
updateHaze();


// ✨ shooting stars unchanged
const shootingContainer = document.getElementById("shootingStars");

function createShootingStar(){
  const star = document.createElement("div");
  star.className = "shooting-star";

  const startX = Math.random()*window.innerWidth;
  const startY = Math.random()*window.innerHeight * 0.5;

  star.style.left = startX+"px";
  star.style.top = startY+"px";

  shootingContainer.appendChild(star);

  let x = startX;
  let y = startY;
  const speed = 8 + Math.random()*4;

  function animate(){
    x += speed;
    y += speed * 0.5;

    star.style.left = x+"px";
    star.style.top = y+"px";
    star.style.opacity = 1 - (x - startX)/300;

    if(star.style.opacity <= 0){
      star.remove();
      return;
    }

    requestAnimationFrame(animate);
  }

  animate();
}

function shootingLoop(){
  const delay = 6000 + Math.random()*12000;
  setTimeout(()=>{
    createShootingStar();
    shootingLoop();
  }, delay);
}

shootingLoop();

</script>

</body>
</html>
