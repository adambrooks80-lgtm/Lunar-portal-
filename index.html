<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
">

<div id="moonWrap" style="
  position:relative;
  width:260px;
  height:260px;
">

  <!-- 🌙 HALO (fixed version) -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background: radial-gradient(
      circle,
      rgba(255,255,255,0.25) 0%,
      rgba(255,255,255,0.15) 55%,
      rgba(255,255,255,0.08) 70%,
      rgba(255,255,255,0.03) 80%,
      transparent 100%
    );
    transform: scale(1.25);
    pointer-events:none;
  "></div>

  <!-- 🌙 MOON SURFACE -->
  <div id="moonSurface" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size: cover;
  ">

    <!-- 🌗 FULL-DISC LIGHTING -->
    <div id="lighting" style="
      position:absolute;
      width:200%;
      height:100%;
      left:-50%;
      background: linear-gradient(
        to right,
        rgba(0,0,0,1) 35%,
        rgba(0,0,0,0.7) 45%,
        rgba(0,0,0,0.3) 50%,
        transparent 60%
      );
      mix-blend-mode: multiply;
    "></div>

    <!-- 🌙 LIMB DARKENING -->
    <div style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(circle at center, transparent 70%, rgba(0,0,0,0.6));
    "></div>

  </div>

</div>

<script>
// 🌙 phase system
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 10000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const lighting = document.getElementById("lighting");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;

  const shift = Math.cos(phase * Math.PI * 2);

  // move full-disc light field
  lighting.style.transform = `translateX(${shift * 80}px)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();
</script>

</body>
</html>
