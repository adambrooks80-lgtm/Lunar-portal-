<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<!-- SKY -->
<div id="stars"></div>

<!-- MOON -->
<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:260px;
  height:260px;
">

  <!-- 🌙 BASE MOON -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
  "></div>

  <!-- 🌙 LIGHT SIDE BOOST -->
  <div id="lightLayer" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:white;
    opacity:0;
    mix-blend-mode:screen;
  "></div>

  <!-- 🌑 EARTHSHINE -->
  <div id="earthshine" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:white;
    opacity:0;
    mix-blend-mode:screen;
  "></div>

  <!-- 🌗 SHADOW (CRISP) -->
  <div id="shadow" style="
    position:absolute;
    width:120%;
    height:120%;
    top:-10%;
    left:-10%;
    border-radius:50%;
    background:black;
  "></div>

</div>

<style>
#stars{
  position:absolute;
  width:100%;
  height:100%;
}
.star{
  position:absolute;
  background:white;
  border-radius:50%;
}
</style>

<script>

// 🌙 CLOCK
const cycle = 12000;
const start = Date.now();

const shadow = document.getElementById("shadow");
const lightLayer = document.getElementById("lightLayer");
const earthshine = document.getElementById("earthshine");

// ⭐ STARS
const starContainer = document.getElementById("stars");

for(let i=0;i<100;i++){
  const s = document.createElement("div");
  s.className = "star";

  const size = Math.random()*1.5 + 0.5;
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  starContainer.appendChild(s);
}

// 🌙 UPDATE
function update(){

  const phase = ((Date.now() - start) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const offset = Math.cos(angle) * 220;

  // 🌗 SHADOW (clean geometry)
  shadow.style.transform = `translateX(${offset}px)`;

  // 🌙 ILLUMINATION
  const illum = (1 - Math.cos(angle)) / 2;

  // 🌙 LIGHT SIDE BOOST (no blur)
  lightLayer.style.opacity = illum * 0.08;
  lightLayer.style.transform =
    `translateX(${offset * 0.2}px)`;

  // 🌑 EARTHSHINE
  earthshine.style.opacity = (1 - illum) * 0.08;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
