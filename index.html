<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<!-- SKY -->
<div id="stars"></div>

<!-- MOON -->
<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:260px;
  height:260px;
">

  <!-- MOON TEXTURE -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
  "></div>

  <!-- EARTHSHINE -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    opacity:0.08;
  "></div>

  <!-- SHADOW -->
  <div id="shadow" style="
    position:absolute;
    width:120%;
    height:120%;
    top:-10%;
    left:-10%;
    border-radius:50%;
    background:black;
    filter:blur(2px);
  "></div>

</div>

<style>
#stars{
  position:absolute;
  width:100%;
  height:100%;
}
.star{
  position:absolute;
  background:white;
  border-radius:50%;
}
</style>

<script>

// 🌙 CLOCK
const cycle = 12000;
const start = Date.now();

const shadow = document.getElementById("shadow");
const moonWrap = document.getElementById("moonWrap");

// ⭐ STARS
const starContainer = document.getElementById("stars");
for(let i=0;i<100;i++){
  const s = document.createElement("div");
  s.className = "star";
  const size = Math.random()*1.5 + 0.5;

  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  starContainer.appendChild(s);
}

// 🌙 UPDATE LOOP
function update(){

  const phase = ((Date.now() - start) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  // 🌗 correct movement (full range)
  const offset = Math.cos(angle) * 220;

  shadow.style.transform = `translateX(${offset}px)`;

  // 🌙 subtle tilt (restored)
  const tilt = Math.sin(angle * 0.5) * 8;
  moonWrap.style.transform =
    `translate(-50%,-50%) rotate(${tilt}deg)`;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
