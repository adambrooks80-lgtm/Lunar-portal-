<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <!-- 🌫️ HALO -->
  <div style="
    position:absolute;
    width:150%;
    height:150%;
    top:-25%;
    left:-25%;
    border-radius:50%;
    background: radial-gradient(
      circle at 60% 50%,
      rgba(255,255,255,0.12),
      rgba(255,255,255,0.04) 40%,
      transparent 75%
    );
    filter: blur(20px);
  "></div>

  <!-- 🌙 BRIGHT MOON -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
  "></div>

  <!-- 🌑 EARTHSHINE -->
  <div id="earthshine" style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    opacity:0.12;
  "></div>

  <!-- 🌗 SOFT TERMINATOR -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">
    <div id="mask" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(
        circle,
        rgba(0,0,0,0.9) 55%,
        rgba(0,0,0,0.6) 65%,
        rgba(0,0,0,0.3) 75%,
        rgba(0,0,0,0.1) 85%,
        transparent 100%
      );
      filter: blur(3px);
    "></div>
  </div>

</div>

<script>

// 🌙 PHASE SYSTEM
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 12000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const mask = document.getElementById("mask");
const earthshine = document.getElementById("earthshine");

// 🎛️ EARTHSHINE CONTROL
const EARTHSHINE_STRENGTH = 0.12;
earthshine.style.opacity = EARTHSHINE_STRENGTH;

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const offset = Math.cos(angle) * 260;

  mask.style.transform = `translateX(${offset}px)`;

  requestAnimationFrame(updateMoon);
}

updateMoon();

</script>

</body>
</html>
