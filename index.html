<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<!-- ⭐ STARS -->
<div id="stars"></div>

<!-- ✨ SHOOTING STARS -->
<div id="shootingStars"></div>

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <!-- 🌫️ HALO -->
  <div id="halo" style="
    position:absolute;
    width:160%;
    height:160%;
    top:-30%;
    left:-30%;
    border-radius:50%;
    background: radial-gradient(
      circle at center,
      rgba(255,255,255,0.12),
      rgba(255,255,255,0.05) 35%,
      rgba(255,255,255,0.02) 55%,
      transparent 75%
    );
    filter: blur(25px);
  "></div>

  <!-- 🌙 MOON -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
  "></div>

  <!-- 🌑 EARTHSHINE -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    opacity:0.10;
  "></div>

  <!-- 🌗 TERMINATOR -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">
    <div id="mask" style="
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(
        circle,
        rgba(0,0,0,0.92) 55%,
        rgba(0,0,0,0.6) 65%,
        rgba(0,0,0,0.3) 75%,
        rgba(0,0,0,0.1) 85%,
        transparent 100%
      );
      filter: blur(3px);
    "></div>
  </div>

</div>

<style>
#stars, #shootingStars {
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}

.star {
  position:absolute;
  background:white;
  border-radius:50%;
}

.shooting-star {
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  box-shadow: 0 0 6px white;
}
</style>

<script>

// 🌙 PHASE SYSTEM
let demo = true;

const realCycle = 29.53 * 24 * 60 * 60 * 1000;
const demoCycle = 12000;
const newMoon = new Date("2000-01-06T18:14:00Z").getTime();

const mask = document.getElementById("mask");
const halo = document.getElementById("halo");
const moonWrap = document.getElementById("moonWrap");

function updateMoon(){
  const now = Date.now();
  const cycle = demo ? demoCycle : realCycle;

  const phase = ((now - newMoon) % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const offset = Math.cos(angle) * 260;

  // shadow movement
  mask.style.transform = `translateX(${offset}px)`;

  // halo slight shift
  halo.style.transform = `translateX(${offset * 0.05}px)`;

  // 🌍 realistic tilt variation (very subtle)
  const tilt = Math.sin(angle * 0.5) * 8;
  moonWrap.style.transform = `
    translate(-50%,-50%) rotate(${12 + tilt}deg)
  `;

  requestAnimationFrame(updateMoon);
}

updateMoon();


// ⭐ STARS (with drift)
const starContainer = document.getElementById("stars");
let stars = [];

function createStars(){
  for(let i=0;i<90;i++){
    const s = document.createElement("div");

    const size = Math.random()*1.8 + 0.4;

    s.className = "star";
    s.style.width = size+"px";
    s.style.height = size+"px";

    s.x = Math.random()*window.innerWidth;
    s.y = Math.random()*window.innerHeight;

    s.style.left = s.x+"px";
    s.style.top = s.y+"px";

    s.style.opacity = Math.random()*0.6 + 0.2;

    stars.push(s);
    starContainer.appendChild(s);
  }
}

createStars();

function updateStars(){
  for(let s of stars){
    // 🌌 very slow drift
    s.x += 0.02;

    if(s.x > window.innerWidth){
      s.x = 0;
      s.y = Math.random()*window.innerHeight;
    }

    // ✨ subtle twinkle
    s.style.opacity += (Math.random()-0.5)*0.02;
    s.style.opacity = Math.max(0.1, Math.min(0.7, s.style.opacity));

    s.style.left = s.x+"px";
  }

  requestAnimationFrame(updateStars);
}

updateStars();


// ✨ SHOOTING STARS (random + rare)
const shootingContainer = document.getElementById("shootingStars");

function createShootingStar(){
  const star = document.createElement("div");
  star.className = "shooting-star";

  const startX = Math.random()*window.innerWidth;
  const startY = Math.random()*window.innerHeight * 0.5;

  star.style.left = startX + "px";
  star.style.top = startY + "px";

  shootingContainer.appendChild(star);

  let x = startX;
  let y = startY;

  const speed = 8 + Math.random()*4;

  function animate(){
    x += speed;
    y += speed * 0.5;

    star.style.left = x + "px";
    star.style.top = y + "px";
    star.style.opacity = 1 - (x - startX)/300;

    if(star.style.opacity <= 0){
      star.remove();
      return;
    }

    requestAnimationFrame(animate);
  }

  animate();
}

// random timing
function shootingLoop(){
  const delay = 4000 + Math.random()*8000;
  setTimeout(()=>{
    createShootingStar();
    shootingLoop();
  }, delay);
}

shootingLoop();

</script>

</body>
</html>
