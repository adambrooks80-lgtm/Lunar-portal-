<!DOCTYPE html>
<html>
<body style="margin:0;background:#121212;">
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  createTexture();
}
window.addEventListener("resize", resize);
resize();

// 🌗 TEST PHASE (change this later)
const phase = 0.25;

// 🌙 STATIC TEXTURE (no spinning)
let craters = [];

function createTexture(){
  const r = Math.min(canvas.width, canvas.height)*0.18;

  craters = [];
  for(let i=0;i<60;i++){
    craters.push({
      x: (Math.random() - 0.5) * r * 1.6,
      y: (Math.random() - 0.5) * r * 1.6,
      size: Math.random() * r * 0.06
    });
  }
}

// DRAW
function draw(){
  const w = canvas.width;
  const h = canvas.height;

  const cx = w/2;
  const cy = h/2;
  const r = Math.min(w,h)*0.18;

  // SKY
  ctx.fillStyle = "#121212";
  ctx.fillRect(0,0,w,h);

  // 🌙 CLIP TO MOON
  ctx.save();

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.clip();

  // BASE MOON
  ctx.fillStyle = "#bbb";
  ctx.fillRect(cx - r, cy - r, r*2, r*2);

  // TEXTURE
  ctx.globalAlpha = 0.05;
  for(let c of craters){
    ctx.beginPath();
    ctx.arc(cx + c.x, cy + c.y, c.size, 0, Math.PI*2);
    ctx.fillStyle = "black";
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 🌗 CORRECT SHADOW (FIXED SIGN)
  const offset = -Math.cos(phase * Math.PI * 2) * r;

  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.arc(cx + offset, cy, r, 0, Math.PI*2);
  ctx.fill();

  ctx.globalCompositeOperation = "source-over";

  ctx.restore();

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
