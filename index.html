<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:linear-gradient(45deg, #7fc8a9, #6aa3d8);
  height:100vh;
  overflow:hidden;
">

<!-- 🌙 MOON -->
<div id="moon" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:260px;
  height:260px;
  border-radius:50%;
  overflow:hidden;

  /* ✅ THIS is the key fix (edge trim) */
  -webkit-mask-image: radial-gradient(circle,
    rgba(0,0,0,1) 97.5%,
    rgba(0,0,0,0) 100%
  );
  mask-image: radial-gradient(circle,
    rgba(0,0,0,1) 97.5%,
    rgba(0,0,0,0) 100%
  );
">

  <!-- 🌙 CROPPED MOON IMAGE -->
  <div style="
    width:112%;
    height:112%;
    margin:-6%;
    background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size:cover;
    background-position:center;
  "></div>

</div>

</body>
</html>
