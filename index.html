<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
">

<div style="position:relative; width:240px; height:240px;">

  <!-- 🌙 Full moon -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    background:#dddddd;
    border-radius:50%;
  "></div>

  <!-- 🌗 Shadow -->
  <div style="
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    border-radius:50%;
    transform:translateX(80px); /* adjust for phase */
  "></div>

</div>

</body>
</html>
