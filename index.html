<!DOCTYPE html>
<html>
<body style="
  margin:0;
  background:black;
  height:100vh;
  overflow:hidden;
">

<div id="skyWrap">
  <div id="stars"></div>
</div>

<div id="moonWrap" style="
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(12deg);
  width:260px;
  height:260px;
">

  <div style="
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
  ">

    <!-- 🌙 MOON -->
    <div id="moonSurface" style="
      position:absolute;
      width:100%;
      height:100%;
      background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
      background-size:cover;
      z-index:1;
    "></div>

    <!-- 🌑 SHADOW -->
    <div id="shadowMain" style="
      position:absolute;
      width:110%;
      height:110%;
      top:-5%;
      left:-5%;
      border-radius:50%;
      background:black;
      opacity:0.9;
      z-index:2;
    "></div>

    <!-- 🌗 TERMINATOR (CORRECT DIRECTION) -->
    <div id="terminatorBand" style="
      position:absolute;
      width:115%;
      height:115%;
      top:-7.5%;
      left:-7.5%;
      border-radius:50%;
      z-index:3;
      background: radial-gradient(circle,
        rgba(0,0,0,0.8) 48%,
        rgba(0,0,0,0.6) 52%,
        rgba(0,0,0,0.35) 56%,
        rgba(0,0,0,0.15) 60%,
        rgba(0,0,0,0.05) 63%,
        rgba(0,0,0,0) 66%
      );
    "></div>

  </div>

</div>

<style>
#skyWrap{ position:absolute; width:100%; height:100%; }
#stars{ position:absolute; width:100%; height:100%; }

.star{
  position:absolute;
  background:white;
  border-radius:50%;
}
</style>

<script>

const cycle = 12000;
const start = Date.now();

const shadowMain = document.getElementById("shadowMain");
const terminatorBand = document.getElementById("terminatorBand");
const moonSurface = document.getElementById("moonSurface");
const moonWrap = document.getElementById("moonWrap");
const skyWrap = document.getElementById("skyWrap");

// stars
const starContainer = document.getElementById("stars");

for(let i=0;i<100;i++){
  const s = document.createElement("div");
  s.className = "star";

  const size = Math.random()*1.4 + 0.4;
  s.style.width = size+"px";
  s.style.height = size+"px";

  s.style.left = Math.random()*window.innerWidth+"px";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.opacity = Math.random()*0.6 + 0.2;

  starContainer.appendChild(s);
}

function update(){

  const now = Date.now();
  const elapsed = now - start;

  const phase = (elapsed % cycle) / cycle;
  const angle = phase * Math.PI * 2;

  const moonRadius = 130;
  const shadowRadius = 145;
  const travel = moonRadius + shadowRadius;

  const offset = Math.cos(angle) * travel;

  shadowMain.style.transform = `translateX(${offset}px)`;
  terminatorBand.style.transform = `translateX(${offset}px)`;

  const rotation = Math.sin(elapsed * 0.00005) * 4;
  const tilt = 12 + Math.sin(angle * 0.5) * 5;

  moonWrap.style.transform =
    `translate(-50%,-50%) rotate(${tilt}deg)`;

  moonSurface.style.transform =
    `rotate(${rotation}deg)`;

  skyWrap.style.transform =
    `rotate(${phase * 360}deg)`;

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
