<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  background:#121212;
}
canvas {
  display:block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const moon = new Image();
moon.src = "https://upload.wikimedia.org/wikipedia/commons/9/9c/Moon_Full_%28LRO%29.jpg";

moon.onload = () => draw();

function draw(){
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = "#121212";
  ctx.fillRect(0,0,w,h);

  const size = Math.min(w,h)*0.42;
  const cx = w/2;
  const cy = h/2;

  ctx.save();

  ctx.beginPath();
  ctx.arc(cx,cy,size/2,0,Math.PI*2);
  ctx.clip();

  ctx.drawImage(moon,cx-size/2,cy-size/2,size,size);

  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.fillRect(cx-size/2,cy-size/2,size,size);

  ctx.globalCompositeOperation="multiply";
  ctx.fillStyle="rgba(235,235,230,0.9)";
  ctx.fillRect(cx-size/2,cy-size/2,size,size);

  ctx.restore();

  const grad = ctx.createRadialGradient(cx,cy,size*0.45,cx,cy,size*0.62);
  grad.addColorStop(0,"rgba(0,0,0,1)");
  grad.addColorStop(1,"rgba(0,0,0,0)");

  ctx.globalCompositeOperation="destination-in";
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,w,h);

  ctx.globalCompositeOperation="source-over";
}
</script>
</body>
</html>
